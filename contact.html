<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ติดต่อ – BunnyPlanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    /* ----------------- Global ----------------- */
    body {
        font-family: 'Segoe UI', sans-serif;
        padding: 20px;
        background: #f7e9e4; /* ชมพูน้ำตาลอ่อน */
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h1 {
        color: #7b4b47;
        margin-bottom: 15px;
    }

    h2 {
        color: #7b4b47;
        margin-bottom: 20px;
    }

    /* ----------------- Header ----------------- */
    header {
        width: 100%;
        background: #c27c78; /* ชมพูน้ำตาลเข้ม */
        padding: 12px 20px;
        border-radius: 10px;
        margin-bottom: 25px;
        text-align: center;
    }

    header nav a {
        color: white;
        text-decoration: none;
        margin: 0 10px;
        font-weight: bold;
    }

    header nav a:hover {
        color: #ffe3e3;
    }

    /* ----------------- Card Form ----------------- */
    .card {
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        max-width: 400px;
        width: 100%;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
        color: #7b4b47;
    }

    input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 6px;
        border: 1px solid #c9a89e;
        box-sizing: border-box;
        font-size: 14px;
    }

    textarea {
        resize: vertical;
    }

    button {
        margin-top: 20px;
        padding: 12px 16px;
        background: #c27c78; /* ชมพูน้ำตาลเข้ม */
        border: none;
        color: white;
        border-radius: 8px;
        width: 100%;
        font-weight: bold;
        cursor: pointer;
        font-size: 15px;
        transition: 0.2s;
    }

    button:hover {
        background: #a8625e;
    }
</style>
</head>

<body>

<h1>BunnyPlanner</h1>

<header>
    <nav>
        <a href="index.html">หน้าหลัก</a> |
        <a href="create.html">สร้างตารางเรียน</a> |
        <a href="contact.html">ติดต่อ</a> |
        <a href="login.html">เข้าสู่ระบบ</a>
    </nav>
</header>

<h2>ติดต่อผู้ดูแลเว็บไซต์</h2>

<div class="card">
    <label>ชื่อ
        <input type="text" placeholder="กรอกชื่อของคุณ">
    </label>

    <label>อีเมล
        <input type="email" placeholder="กรอกอีเมลของคุณ">
    </label>

    <label>ข้อความ
        <textarea rows="4" placeholder="พิมพ์ข้อความของคุณที่นี่..."></textarea>
    </label>

    <button><a href="messwin.html">ส่งข้อความ</a></button>
</div>

</body>
</html>
